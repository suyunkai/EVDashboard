<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title description">
  <title id="title">EVDashboard</title>
  <desc id="description">Instrument images, chimes, and presets. For head units with a single Antora 1000 chip. Android 11 or later, arm64.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1440" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1B2B"/>
      <stop offset="1" stop-color="#102C3C"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17536B"/>
      <stop offset=".5" stop-color="#117B86"/>
      <stop offset="1" stop-color="#0A4654"/>
    </linearGradient>
    <linearGradient id="wave" x1="1010" y1="70" x2="1310" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8DF4D4"/>
      <stop offset="1" stop-color="#5387FF"/>
    </linearGradient>
    <clipPath id="bounds"><rect width="1440" height="360" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
