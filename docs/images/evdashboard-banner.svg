      <path d="M29 69A29 29 0 1 1 79 69" fill="none" stroke="#F0FFF9" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M31 54h5M38 36l3 4M54 30v5M70 36l-3 4M77 54h-5" fill="none" stroke="#8DE4D6" stroke-width="2.6" stroke-linecap="round"/>
